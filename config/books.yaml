# Runtime source of truth for the corpus. IDs match HANDOVER.md §2.
# `pdf` paths are relative to the repo root. Nothing under books/ is committed.
#
# Per-book fields:
#   title, edition      human-readable; fill in at intake
#   course              mitx | fmba  (selects config/readings/<course>.yaml, optional)
#   profile             expected difficulty (from HANDOVER §2), informs benchmark expectations
#   pdf                 landing-zone path, books/<id>/<id>.pdf
#   body_range          {begin, end} 0-based pdf indices sampled by scripts/check_books.py
#   toc.source          outline | manual — stage 1 uses the PDF outline unless set to manual
#   toc.chapter_level   outline level that holds chapters (null = not yet measured)
#   toc.chapter_pattern regex on the (normalized) outline title; group 1 = chapter number
#   toc.normalize       optional list of in-memory outline fixes applied before the pattern,
#                       e.g. [number_from_sections] when chapter titles carry no number but
#                       their first section does ("1.1 ..."); steps live in src/toc.py
#   toc.page_offset     printed = pdf_1based - page_offset; fallback when page labels are
#                       missing; null = unknown (stage 1 then fails if labels are absent)
#   chapter_ranges      chNN: [first_idx, last_idx] (0-based, inclusive) — overrides the
#                       outline for one chapter; the only way in for books with null pattern
#   routing             per-book MinerU flags consumed by stage 2:
#                       inline_formula -> -f, table -> -t, image_analysis -> --image-analysis,
#                       lang -> -l

books:
  bkm:
    title: "Investments"
    edition: "13e (Bodie, et al.)"
    course: mitx
    profile: formulas
    pdf: books/bkm/bkm.pdf
    body_range: {begin: 4, end: 1072}
    toc: {source: outline, chapter_level: 2, chapter_pattern: '^Chapter (\d+):', page_offset: 29}
    chapter_ranges: {}
    routing: {inline_formula: true}

  bma:
    title: "Principles of Corporate Finance"
    edition: "14e (Brealey et al.)"
    course: mitx
    profile: formulas-heavy
    pdf: books/bma/bma.pdf
    body_range: {begin: 4, end: 1052}
    toc: {source: outline, chapter_level: 2, chapter_pattern: '^(\d+):', page_offset: 31}
    chapter_ranges: {}
    routing: {inline_formula: true}

  ops:
    title: "Matching Supply with Demand: An Introduction to Operations Management"
    edition: "5e (Cachon & Terwiesch)"
    course: fmba
    profile: diagrams+math
    pdf: books/ops/ops.pdf
    body_range: {begin: 7, end: 1284}
    # Reflowed e-book: no printed page numbers per PDF page (the original book's breaks appear
    # inline as "Page N" markers). page_offset 0 = report PDF 1-based pages as printed pages.
    toc: {source: outline, chapter_level: 1, chapter_pattern: '^Chapter (\d+):', page_offset: 0}
    chapter_ranges: {}
    routing: {inline_formula: true}

  strat:
    title: "Strategic Management: Creating Competitive Advantages"
    edition: "13e (Dess et al.)"
    course: fmba
    profile: prose+exhibits
    pdf: books/strat/strat.pdf
    body_range: {begin: 4, end: 509}
    toc: {source: outline, chapter_level: 2, chapter_pattern: '^CHAPTER (\d+)\b', page_offset: 43}
    chapter_ranges: {}
    routing: {inline_formula: false}   # prose book; inline-formula detection is pure false-positive cost

  stats:
    title: "Statistics for Business & Economics"
    edition: "15e (Anderson et al.)"
    course: fmba
    profile: formulas+tables
    pdf: books/stats/stats.pdf
    body_range: {begin: 2, end: 1211}
    toc: {source: outline, chapter_level: 1, chapter_pattern: '^(\d+): ', normalize: [number_from_sections], page_offset: 31}
    chapter_ranges: {}
    routing: {inline_formula: true}

  corpfin:
    title: "Corporate Finance"
    edition: "13e (Ross et al.)"
    course: fmba
    profile: formulas+tables-hardest
    pdf: books/corpfin/corpfin.pdf
    body_range: {begin: 4, end: 1055}
    toc: {source: outline, chapter_level: 1, chapter_pattern: '^Chapter (\d+)\b', page_offset: 33}  # measured via scripts/probe_toc.py
    chapter_ranges: {}
    routing: {inline_formula: true}

  acct:
    title: "Financial Accounting: A Business Approach"
    edition: "11e (JAMIE PRATT, MICHAEL PETERS)"
    course: fmba
    profile: tables-everywhere
    pdf: books/acct/acct.pdf
    body_range: {begin: 4, end: 1179}
    # Reflowed e-book with no printed page numbers at all. page_offset 0 = PDF 1-based pages.
    toc: {source: outline, chapter_level: 2, chapter_pattern: '^CHAPTER (\d+):', page_offset: 0}
    chapter_ranges: {}
    routing: {inline_formula: true}
