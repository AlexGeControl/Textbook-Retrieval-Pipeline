[project]
name = "textbook-retrieval-pipeline"
version = "0.0.1"
description = "Born-digital textbook chapters -> certified Obsidian markdown"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5",
    "mineru[pipeline]>=3.4.5,<4",
    "pylatexenc>=2.10",
    "pymupdf>=1.28",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
# vllm ships no macOS wheels; the Mac is client-only and syncs without this extra
server = ["mineru[vllm]>=3.4.5,<4; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
# FastAPI >=0.137 wraps included routers in `_IncludedRouter` (no `.path`), which makes the
# prometheus middleware in vllm 0.20.x return 500 on every request. Drop this once mineru
# allows a vllm that includes vllm-project/vllm#45629.
constraint-dependencies = ["fastapi<0.137"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a live MinerU server (MINERU_SERVER_URL)",
    "workdir: reads work/<book>/<chNN>/ produced by make chapter (skips when absent)",
    "vault: needs OBSIDIAN_HOST, OBSIDIAN_PORT, OBSIDIAN_API_KEY and a live vault",
]
addopts = "-m 'not integration and not vault'"

[tool.ruff]
line-length = 100
target-version = "py310"
